<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GitHub ephemeral runners on AWS Lambda MicroVMs - architecture and flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4043"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <style>
      .panel-title { font-size: 15px; font-weight: 700; fill: #202124; }
      .h { font-size: 14px; font-weight: 700; fill: #202124; }
      .t { font-size: 12px; fill: #3c4043; }
      .m { font-size: 11.5px; fill: #3c4043; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .small { font-size: 11px; fill: #5f6368; }
      .ms { font-size: 10px; fill: #3c4043; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke: #3c4043; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flow-dash { stroke: #3c4043; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .obs { stroke: #1a73e8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-blue); }
      .step circle { fill: #202124; }
      .step text { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .lbl { font-size: 11px; fill: #3c4043; font-style: italic; }
    </style>
  </defs>

  <rect width="1500" height="1100" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="700" fill="#202124">GitHub ephemeral runners on AWS Lambda MicroVMs</text>
  <text x="40" y="66" class="t">One job → one MicroVM. Each job picks a runner profile (arm64 | x86_64) × (plain | Docker) × (small | medium | large) with a single runs-on label.</text>

  <!-- ═══════════════ GitHub panel ═══════════════ -->
  <rect x="40" y="90" width="250" height="560" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="56" y="112" class="panel-title">GitHub</text>

  <rect x="60" y="122" width="210" height="72" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="72" y="143" class="h">REST API (GitHub App)</text>
  <text x="72" y="162" class="t">installation token →</text>
  <text x="72" y="178" class="m">generate-jitconfig</text>

  <rect x="60" y="214" width="210" height="82" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="72" y="235" class="h">App webhook</text>
  <text x="72" y="254" class="m">workflow_job</text>
  <text x="72" y="270" class="t">queued · in_progress · completed</text>
  <text x="72" y="286" class="small">HMAC-SHA256 signed</text>

  <rect x="60" y="322" width="210" height="100" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="72" y="343" class="h">Workflow job</text>
  <text x="72" y="362" class="m">runs-on: [self-hosted,</text>
  <text x="72" y="378" class="m">  mvm-x64-docker-medium]</text>
  <text x="72" y="398" class="small">exactly one mvm-&lt;profile&gt; label;</text>
  <text x="72" y="412" class="small">runner carries only that label</text>
  <path d="M165,322 L165,298" class="flow"/>

  <rect x="60" y="448" width="210" height="110" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="72" y="469" class="h">Ephemeral JIT runner</text>
  <text x="72" y="488" class="t">labels: self-hosted + its profile</text>
  <text x="72" y="504" class="t">only; takes exactly one job,</text>
  <text x="72" y="520" class="t">deregisters itself afterwards</text>
  <text x="72" y="544" class="small">no long-lived runners</text>

  <!-- ═══════════════ AWS panel ═══════════════ -->
  <rect x="320" y="90" width="1140" height="560" rx="12" fill="#fffaf3" stroke="#e07b00" stroke-width="1.5"/>
  <text x="1444" y="112" class="panel-title" text-anchor="end">AWS account · Region</text>

  <!-- API Gateway -->
  <rect x="345" y="140" width="170" height="80" rx="8" fill="#ffffff" stroke="#e07b00"/>
  <text x="357" y="162" class="h">API Gateway</text>
  <text x="357" y="181" class="t">HTTP API</text>
  <text x="357" y="198" class="m">POST /webhook</text>

  <!-- Orchestrator -->
  <rect x="545" y="130" width="230" height="140" rx="8" fill="#ffffff" stroke="#e07b00"/>
  <text x="557" y="152" class="h">Orchestrator Lambda</text>
  <text x="557" y="171" class="t">• verify HMAC (secret in SSM)</text>
  <text x="557" y="187" class="t">• needs exactly one deployed</text>
  <text x="557" y="203" class="t">   mvm-&lt;profile&gt; label</text>
  <text x="557" y="219" class="t">• else 422 + UnroutableJobs</text>
  <text x="557" y="235" class="t">• in_progress / completed →</text>
  <text x="557" y="251" class="t">   queue time, duration, outcome</text>

  <!-- SQS -->
  <rect x="805" y="140" width="160" height="80" rx="8" fill="#ffffff" stroke="#c7186e"/>
  <text x="817" y="162" class="h">SQS work queue</text>
  <text x="817" y="181" class="m">{owner, repo, runId,</text>
  <text x="817" y="197" class="m"> labels, profile}</text>
  <rect x="805" y="250" width="160" height="56" rx="8" fill="#fdeef4" stroke="#c7186e"/>
  <text x="817" y="272" class="h">DLQ</text>
  <text x="817" y="290" class="t">after 3 failed launches</text>
  <path d="M885,220 L885,248" class="flow-dash"/>

  <!-- Worker -->
  <rect x="995" y="130" width="230" height="140" rx="8" fill="#ffffff" stroke="#e07b00"/>
  <text x="1007" y="152" class="h">Worker Lambda</text>
  <text x="1007" y="171" class="t">• App JWT → installation token</text>
  <text x="1007" y="187" class="t">   → JIT runner config</text>
  <text x="1007" y="203" class="t">• image = &lt;Project&gt;-&lt;profile&gt;</text>
  <text x="1007" y="219" class="t">• RunMicrovm, log stream</text>
  <text x="1007" y="235" class="m">  &lt;profile&gt;/gh-runner-&lt;run&gt;-…</text>
  <text x="1007" y="254" class="t">• 3 attempts, then back to SQS</text>

  <!-- MicroVM images -->
  <rect x="345" y="330" width="420" height="300" rx="8" fill="#f1f8f1" stroke="#2e7d32"/>
  <text x="357" y="352" class="h">MicroVM images — one per runner profile</text>
  <text x="357" y="370" class="small">image name &lt;Project&gt;-&lt;profile&gt; · snapshotted after /ready</text>

  <rect x="360" y="382" width="190" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="372" y="402" class="h">arm64 · plain</text>
  <text x="372" y="420" class="m">arm64-small</text>
  <text x="372" y="435" class="m">arm64-medium</text>
  <text x="372" y="450" class="m">arm64-large</text>

  <rect x="562" y="382" width="190" height="78" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="574" y="402" class="h">x86_64 · plain</text>
  <text x="574" y="420" class="m">x64-small</text>
  <text x="574" y="435" class="m">x64-medium</text>
  <text x="574" y="450" class="m">x64-large</text>

  <rect x="360" y="470" width="190" height="64" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="372" y="490" class="h">arm64 · Docker</text>
  <text x="372" y="508" class="m">arm64-docker-medium</text>
  <text x="372" y="523" class="m">arm64-docker-large</text>

  <rect x="562" y="470" width="190" height="64" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="574" y="490" class="h">x86_64 · Docker</text>
  <text x="574" y="508" class="m">x64-docker-medium</text>
  <text x="574" y="523" class="m">x64-docker-large</text>

  <text x="357" y="556" class="t">Size = baseline memory, burst up to 4×:</text>
  <text x="357" y="573" class="m">small  2 GB/1 vCPU → 8 GB/4 vCPU,   8 GB disk</text>
  <text x="357" y="589" class="m">medium 4 GB/2 vCPU → 16 GB/8 vCPU, 16 GB disk</text>
  <text x="357" y="605" class="m">large  8 GB/4 vCPU → 32 GB/16 vCPU, 32 GB disk</text>
  <text x="357" y="622" class="small">x86_64 needs base image v3+ · Docker: dockerd warm in snapshot</text>

  <!-- Running MicroVM -->
  <rect x="805" y="330" width="420" height="300" rx="8" fill="#f1f8f1" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="817" y="352" class="h">Running MicroVM (one job)</text>
  <text x="817" y="370" class="small">NO_INGRESS · INTERNET_EGRESS · execution role via IMDSv2</text>
  <text x="817" y="396" class="t">a. resumes from the profile's snapshot in seconds</text>
  <text x="817" y="418" class="t">b. /run hook (app.js :9000) gunzips the JIT config</text>
  <text x="817" y="440" class="t">c. </text><text x="833" y="440" class="m">run.sh --jitconfig</text><text x="975" y="440" class="t">registers + runs one job</text>
  <text x="817" y="462" class="t">d. resource sampler every 5 s: CPU / memory / disk</text>
  <text x="817" y="484" class="t">e. runner exits → </text><text x="927" y="484" class="m">job_summary</text><text x="1015" y="484" class="t">log line +</text>
  <text x="833" y="500" class="t">per-job peaks via PutMetricData</text>
  <text x="817" y="522" class="t">f. TerminateMicrovm on itself (idle / max-duration</text>
  <text x="833" y="538" class="t">policy is the safety net)</text>
  <rect x="817" y="556" width="396" height="60" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-dasharray="4 3"/>
  <text x="829" y="576" class="small">Docker profiles: dockerd + dnsmasq (DNS forwarder for containers)</text>
  <text x="829" y="592" class="small">already running from the snapshot → docker build / buildx / compose</text>
  <text x="829" y="608" class="small">native linux/amd64 on x64-*, linux/arm64 on arm64-* (no QEMU)</text>

  <!-- Observability column -->
  <rect x="1250" y="130" width="190" height="120" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="1262" y="152" class="h">CloudWatch Logs</text>
  <text x="1262" y="171" class="ms">/aws/lambda/P-orchestrator</text>
  <text x="1262" y="186" class="ms">/aws/lambda/P-worker</text>
  <text x="1262" y="201" class="ms">/aws/lambda-microvms/P</text>
  <text x="1262" y="220" class="small">VM stream per runner, joinable</text>
  <text x="1262" y="235" class="small">on the GitHub run id</text>

  <rect x="1250" y="265" width="190" height="125" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="1262" y="287" class="h">Metrics</text>
  <text x="1262" y="304" class="small">GitHubRunnerMicroVMs × Profile</text>
  <text x="1262" y="322" class="ms">JobsQueued RunnersLaunched</text>
  <text x="1262" y="337" class="ms">RunnerLaunchFailures</text>
  <text x="1262" y="352" class="ms">JobQueueTime JobDuration</text>
  <text x="1262" y="367" class="ms">CpuCoresUsed MemoryUsedMiB</text>
  <text x="1262" y="382" class="ms">JobPeak{Cpu,Memory,Disk}</text>

  <rect x="1250" y="405" width="190" height="105" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="1262" y="427" class="h">Alarms → SNS</text>
  <text x="1262" y="446" class="t">DLQ not empty · backlog</text>
  <text x="1262" y="462" class="t">launch failures · unroutable</text>
  <text x="1262" y="478" class="t">webhook errors · slow start</text>
  <text x="1262" y="498" class="small">email / Slack / PagerDuty</text>

  <rect x="1250" y="525" width="190" height="105" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="1262" y="547" class="h">Dashboard</text>
  <text x="1262" y="566" class="t">demand + launches per profile</text>
  <text x="1262" y="582" class="t">queue time, duration, outcome</text>
  <text x="1262" y="598" class="t">p90 job peaks → right-size</text>
  <text x="1262" y="614" class="t">SQS, Lambda, failure tables</text>

  <!-- ═══════════════ Runtime flow arrows ═══════════════ -->
  <!-- 1 webhook → API GW -->
  <path d="M270,255 L312,255 L312,180 L343,180" class="flow"/>
  <!-- 2 API GW → Orchestrator -->
  <path d="M515,180 L543,180" class="flow"/>
  <!-- 3 Orchestrator → SQS -->
  <path d="M775,180 L803,180" class="flow"/>
  <!-- 4 SQS → Worker -->
  <path d="M965,180 L993,180" class="flow"/>
  <!-- 5 Worker ↔ GitHub REST API -->
  <path d="M1110,130 L1110,118 L300,118 L300,158 L272,158" class="flow" marker-start="url(#arrow)"/>
  <!-- 6 Worker → Running MicroVM -->
  <path d="M1110,270 L1110,328" class="flow"/>
  <!-- images → running VM (snapshot) -->
  <path d="M765,480 L803,480" class="flow-dash"/>
  <text x="768" y="472" class="lbl">resume</text>
  <!-- 7 Running VM → JIT runner in GitHub -->
  <path d="M900,630 L900,664 L165,664 L165,560" class="flow"/>
  <!-- 8 observability -->
  <path d="M1225,185 L1248,185" class="obs"/>
  <path d="M1225,360 L1248,360" class="obs"/>
  <path d="M775,250 L790,250 L790,322 L1238,322 L1238,300 L1248,300" class="obs"/>

  <!-- Step badges -->
  <g class="step"><circle cx="291" cy="255" r="10"/><text x="291" y="255">1</text></g>
  <g class="step"><circle cx="529" cy="162" r="10"/><text x="529" y="162">2</text></g>
  <g class="step"><circle cx="789" cy="162" r="10"/><text x="789" y="162">3</text></g>
  <g class="step"><circle cx="979" cy="162" r="10"/><text x="979" y="162">4</text></g>
  <g class="step"><circle cx="700" cy="118" r="10"/><text x="700" y="118">5</text></g>
  <g class="step"><circle cx="1110" cy="299" r="10"/><text x="1110" y="299">6</text></g>
  <g class="step"><circle cx="530" cy="664" r="10"/><text x="530" y="664">7</text></g>
  <g class="step"><circle cx="1237" cy="360" r="10"/><text x="1237" y="360">8</text></g>

  <!-- ═══════════════ Deploy-time band ═══════════════ -->
  <rect x="40" y="690" width="1420" height="380" rx="12" fill="#faf5fe" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="56" y="714" class="panel-title">Deploy time — scripts/ → CloudFormation stacks (all idempotent, state in scripts/.deploy-state.env)</text>

  <rect x="60" y="730" width="230" height="200" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="72" y="752" class="h">scripts/</text>
  <text x="72" y="774" class="m">00-create-ssm-params.sh</text>
  <text x="72" y="793" class="m">01-deploy-foundation.sh</text>
  <text x="72" y="812" class="m">02-package-lambdas.sh</text>
  <text x="72" y="831" class="m">03-deploy-microvm-images.sh</text>
  <text x="72" y="850" class="m">04-deploy-orchestrator.sh</text>
  <text x="72" y="869" class="m">05-deploy-observability.sh</text>
  <text x="72" y="893" class="small">Profiles changed? run 03, then 04.</text>
  <text x="72" y="909" class="small">Lambda code changed? 02, then 04.</text>

  <rect x="320" y="730" width="250" height="110" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="332" y="752" class="h">01-foundation.yaml</text>
  <text x="332" y="772" class="t">S3 code bucket (versioned)</text>
  <text x="332" y="789" class="t">MicroVM build role</text>
  <text x="332" y="806" class="t">managed base image ARN</text>
  <text x="332" y="826" class="small">+ SSM SecureStrings (via 00 script)</text>

  <rect x="320" y="858" width="250" height="118" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="332" y="880" class="h">S3 artifacts (content-hashed)</text>
  <text x="332" y="900" class="m">lambda/worker-&lt;hash&gt;.zip</text>
  <text x="332" y="916" class="m">lambda/orchestrator-&lt;hash&gt;.zip</text>
  <text x="332" y="932" class="m">microvm/&lt;flavor&gt;/</text>
  <text x="332" y="948" class="m">  code-artifact-&lt;hash&gt;.zip</text>

  <rect x="600" y="730" width="330" height="238" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="612" y="752" class="h">02-microvm-images.yaml</text>
  <text x="612" y="772" class="t">• Profiles mapping: Architecture × MemoryMiB</text>
  <text x="612" y="790" class="t">• Fn::ForEach over NoDockerProfiles and</text>
  <text x="612" y="806" class="t">   DockerProfiles → one image per profile</text>
  <text x="612" y="824" class="t">• 2 code artifacts: Dockerfile.base / .docker,</text>
  <text x="612" y="840" class="t">   each detects arm64 vs amd64 at build time</text>
  <text x="612" y="858" class="t">• Lambda builds natively on the profile's arch,</text>
  <text x="612" y="874" class="t">   waits for /ready, snapshots disk + memory</text>
  <text x="612" y="892" class="t">• newest AVAILABLE base image supporting</text>
  <text x="612" y="908" class="t">   REQUIRED_ARCHS (x86_64 → version 3+)</text>
  <text x="612" y="926" class="t">• shared log group with retention</text>
  <text x="612" y="948" class="small">needs CAPABILITY_AUTO_EXPAND (LanguageExtensions)</text>

  <rect x="960" y="730" width="240" height="110" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="972" y="752" class="h">03-orchestrator.yaml</text>
  <text x="972" y="772" class="t">API Gateway, both Lambdas,</text>
  <text x="972" y="789" class="t">SQS + DLQ, MicroVM execution role</text>
  <text x="972" y="806" class="t">IAM scoped to the exact</text>
  <text x="972" y="822" class="t">deployed image ARNs</text>

  <rect x="1230" y="730" width="210" height="110" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="1242" y="752" class="h">04-observability.yaml</text>
  <text x="1242" y="772" class="t">SNS alarm topic</text>
  <text x="1242" y="789" class="t">6 alarms</text>
  <text x="1242" y="806" class="t">CloudWatch dashboard</text>
  <text x="1242" y="826" class="small">SEARCH() picks up new profiles</text>

  <path d="M570,785 L598,785" class="flow-dash"/>
  <path d="M570,913 L598,913" class="flow-dash"/>
  <path d="M930,785 L958,785" class="flow-dash"/>
  <path d="M1200,785 L1228,785" class="flow-dash"/>

  <!-- Legend -->
  <rect x="960" y="858" width="480" height="196" rx="8" fill="#ffffff" stroke="#7b1fa2"/>
  <text x="972" y="880" class="h">Runtime flow</text>
  <g class="t">
    <text x="972" y="900">1  GitHub sends the signed workflow_job webhook</text>
    <text x="972" y="919">2  Orchestrator verifies it and resolves the job's runner profile</text>
    <text x="972" y="938">3  Runner request queued (202 back to GitHub in milliseconds)</text>
    <text x="972" y="957">4  Worker consumes it (retries, then DLQ)</text>
    <text x="972" y="976">5  Worker mints a JIT runner config via the GitHub App</text>
    <text x="972" y="995">6  RunMicrovm on the profile's image</text>
    <text x="972" y="1014">7  VM registers as a JIT runner and runs exactly one job</text>
    <text x="972" y="1033">8  Logs + metrics → alarms / dashboard; VM terminates itself</text>
  </g>
  <text x="60" y="1004" class="small">Solid arrows: runtime request path · dashed purple: deploy-time inputs · dashed blue: telemetry</text>
  <text x="60" y="1022" class="small">P = ProjectName (default github-runner-orchestrator)</text>
</svg>
