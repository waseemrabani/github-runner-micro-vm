schema_version: "1.1"
name: picks-profile-for-amd64-docker-build
expected_outcome: |
  Recommends runs-on with exactly one x86_64 Docker profile label (mvm-x64-docker-medium via burst, or mvm-x64-docker-large for sustained 4 vCPU), optionally with self-hosted, explains the size choice using the baseline/burst model and disk, and checks or flags whether that profile is actually deployed.
